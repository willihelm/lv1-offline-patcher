name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Keeps a release PR open that bumps the version and updates CHANGELOG.md.
  # Merging it tags the commit and creates the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Tags created with GITHUB_TOKEN don't trigger other workflows, so the installers are built here.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri.release.conf.json adds the signed update bundles; tauri-action attaches them and the
      # latest.json the app's updater reads (src-tauri/src/updater.rs). Needs the repository secret
      # TAURI_SIGNING_PRIVATE_KEY, the private half of plugins.updater.pubkey in tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  # The update dialog shows the notes from latest.json: put the release's changelog there.
  updater-notes:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          jq --arg notes "$notes" '.notes = $notes' latest.json > notes.json
          mv notes.json latest.json
          cat latest.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber latest.json
