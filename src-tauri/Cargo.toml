[package]
name = "lv1-offline-patcher"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Edit the patch of a Waves LV1 showfile offline"

[lib]
name = "lv1_offline_patcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo"] }
